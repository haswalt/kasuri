apiVersion: apps/v1
kind: Deployment
metadata:
  name: kasuri
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kasuri
  template:
    metadata:
      labels:
        app: kasuri
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kasuri
          image: kasuri:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATA_DIR
              value: /data
            - name: SESSION_TTL_HOURS
              value: "0"
            - name: BASIC_AUTH_FILE
              value: /run/secrets/kasuri/credentials
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
            - name: auth
              mountPath: /run/secrets/kasuri
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kasuri-data
        - name: auth
          secret:
            secretName: kasuri-auth
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
