<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Kasuri">
  <!-- Weft (horizontal) ribbons, drawn first -->
  <rect x="3" y="7" width="26" height="7" rx="1" fill="#4CC3CB"/>
  <rect x="3" y="11.5" width="26" height="2.5" fill="#2A9AA4"/>
  <rect x="3" y="18" width="26" height="7" rx="1" fill="#4CC3CB"/>
  <rect x="3" y="22.5" width="26" height="2.5" fill="#2A9AA4"/>
  <!-- Shadows on the weft where the warp passes over -->
  <rect x="5.5" y="7" width="1.5" height="7" fill="#04363C" fill-opacity=".35"/>
  <rect x="14" y="7" width="1.5" height="7" fill="#04363C" fill-opacity=".35"/>
  <rect x="16.5" y="18" width="1.5" height="7" fill="#04363C" fill-opacity=".35"/>
  <rect x="25" y="18" width="1.5" height="7" fill="#04363C" fill-opacity=".35"/>
  <!-- Warp (vertical) ribbons -->
  <rect x="7" y="3" width="7" height="26" rx="1" fill="#138A96"/>
  <rect x="11.5" y="3" width="2.5" height="26" fill="#0B6470"/>
  <rect x="18" y="3" width="7" height="26" rx="1" fill="#138A96"/>
  <rect x="22.5" y="3" width="2.5" height="26" fill="#0B6470"/>
  <!-- Shadows on the warp where the weft passes over -->
  <rect x="18" y="5.5" width="7" height="1.5" fill="#04363C" fill-opacity=".35"/>
  <rect x="18" y="14" width="7" height="1.5" fill="#04363C" fill-opacity=".35"/>
  <rect x="7" y="16.5" width="7" height="1.5" fill="#04363C" fill-opacity=".35"/>
  <rect x="7" y="25" width="7" height="1.5" fill="#04363C" fill-opacity=".35"/>
  <!-- Weft passes over the warp at two crossings -->
  <rect x="18" y="7" width="7" height="7" fill="#4CC3CB"/>
  <rect x="18" y="11.5" width="7" height="2.5" fill="#2A9AA4"/>
  <rect x="7" y="18" width="7" height="7" fill="#4CC3CB"/>
  <rect x="7" y="22.5" width="7" height="2.5" fill="#2A9AA4"/>
</svg>
