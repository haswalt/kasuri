<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kasuri · Woven mark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 56px 64px; display: flex; flex-direction: column; gap: 32px; background: #F7F8FA; color: #181B21; font-family: Inter, system-ui, sans-serif">
  <div>
    <div style="font-size: 11px; letter-spacing: .14em; color: #6B7280">BRAND</div>
    <h1 style="margin: 8px 0 6px; font-size: 28px; font-weight: 600; letter-spacing: -0.025em">The woven mark</h1>
    <p style="margin: 0; font-size: 14px; color: #525967; max-width: 760px">A 2 × 2 plain weave: two warp ribbons and two weft ribbons passing over and under each other. Flat fills only; the depth comes from a darker fold on each ribbon and a soft shadow where one ribbon dives under another.</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{ panels }}" as="p" hint-placeholder-count="2">
      <div style="{{ p.style }}">
        <svg width="168" height="168" viewBox="0 0 32 32" role="img" aria-label="Kasuri woven mark"><rect x="3" y="7" width="26" height="7" rx="1" fill="#4CC3CB"></rect><rect x="3" y="11.5" width="26" height="2.5" fill="#2A9AA4"></rect><rect x="3" y="18" width="26" height="7" rx="1" fill="#4CC3CB"></rect><rect x="3" y="22.5" width="26" height="2.5" fill="#2A9AA4"></rect><rect x="5.5" y="7" width="1.5" height="7" fill="#04363C" fill-opacity=".35"></rect><rect x="14" y="7" width="1.5" height="7" fill="#04363C" fill-opacity=".35"></rect><rect x="16.5" y="18" width="1.5" height="7" fill="#04363C" fill-opacity=".35"></rect><rect x="25" y="18" width="1.5" height="7" fill="#04363C" fill-opacity=".35"></rect><rect x="7" y="3" width="7" height="26" rx="1" fill="#138A96"></rect><rect x="11.5" y="3" width="2.5" height="26" fill="#0B6470"></rect><rect x="18" y="3" width="7" height="26" rx="1" fill="#138A96"></rect><rect x="22.5" y="3" width="2.5" height="26" fill="#0B6470"></rect><rect x="18" y="5.5" width="7" height="1.5" fill="#04363C" fill-opacity=".35"></rect><rect x="18" y="14" width="7" height="1.5" fill="#04363C" fill-opacity=".35"></rect><rect x="7" y="16.5" width="7" height="1.5" fill="#04363C" fill-opacity=".35"></rect><rect x="7" y="25" width="7" height="1.5" fill="#04363C" fill-opacity=".35"></rect><rect x="18" y="7" width="7" height="7" fill="#4CC3CB"></rect><rect x="18" y="11.5" width="7" height="2.5" fill="#2A9AA4"></rect><rect x="7" y="18" width="7" height="7" fill="#4CC3CB"></rect><rect x="7" y="22.5" width="7" height="2.5" fill="#2A9AA4"></rect></svg>
        <span style="font-size: 72px; font-weight: 600; letter-spacing: -0.04em; line-height: 1">kasuri</span>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 40px; padding: 28px 32px; border: 1px solid #E5E7EB; border-radius: 12px; background: #FFFFFF">
    <sc-for list="{{ sizes }}" as="s" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
        <svg width="{{ s.px }}" height="{{ s.px }}" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="7" width="26" height="7" rx="1" fill="#4CC3CB"></rect><rect x="3" y="11.5" width="26" height="2.5" fill="#2A9AA4"></rect><rect x="3" y="18" width="26" height="7" rx="1" fill="#4CC3CB"></rect><rect x="3" y="22.5" width="26" height="2.5" fill="#2A9AA4"></rect><rect x="5.5" y="7" width="1.5" height="7" fill="#04363C" fill-opacity=".35"></rect><rect x="14" y="7" width="1.5" height="7" fill="#04363C" fill-opacity=".35"></rect><rect x="16.5" y="18" width="1.5" height="7" fill="#04363C" fill-opacity=".35"></rect><rect x="25" y="18" width="1.5" height="7" fill="#04363C" fill-opacity=".35"></rect><rect x="7" y="3" width="7" height="26" rx="1" fill="#138A96"></rect><rect x="11.5" y="3" width="2.5" height="26" fill="#0B6470"></rect><rect x="18" y="3" width="7" height="26" rx="1" fill="#138A96"></rect><rect x="22.5" y="3" width="2.5" height="26" fill="#0B6470"></rect><rect x="18" y="5.5" width="7" height="1.5" fill="#04363C" fill-opacity=".35"></rect><rect x="18" y="14" width="7" height="1.5" fill="#04363C" fill-opacity=".35"></rect><rect x="7" y="16.5" width="7" height="1.5" fill="#04363C" fill-opacity=".35"></rect><rect x="7" y="25" width="7" height="1.5" fill="#04363C" fill-opacity=".35"></rect><rect x="18" y="7" width="7" height="7" fill="#4CC3CB"></rect><rect x="18" y="11.5" width="7" height="2.5" fill="#2A9AA4"></rect><rect x="7" y="18" width="7" height="7" fill="#4CC3CB"></rect><rect x="7" y="22.5" width="7" height="2.5" fill="#2A9AA4"></rect></svg>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #6B7280">{{ s.label }}</span>
      </div>
    </sc-for>
    <span style="flex: 1"></span>
    <div style="display: flex; gap: 14px">
      <sc-for list="{{ swatches }}" as="c" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start">
          <span style="{{ c.chip }}"></span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #525967">{{ c.hex }}</span>
          <span style="font-size: 11px; color: #6B7280">{{ c.name }}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var panel = function (bg, fg, border) {
      return 'height: 400px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 28px; background: ' + bg + '; color: ' + fg + '; border: 1px solid ' + border;
    };
    return {
      panels: [{ style: panel('#FFFFFF', '#181B21', '#E5E7EB') }, { style: panel('#0B0D11', '#E6E8EC', '#0B0D11') }],
      sizes: [{ px: 96, label: '96' }, { px: 48, label: '48' }, { px: 32, label: '32' }, { px: 20, label: '20' }, { px: 16, label: '16' }],
      swatches: [['#4CC3CB', 'Weft'], ['#2A9AA4', 'Weft fold'], ['#138A96', 'Warp'], ['#0B6470', 'Warp fold']].map(function (c) {
        return { hex: c[0], name: c[1], chip: 'width: 56px; height: 36px; border-radius: 6px; background: ' + c[0] };
      })
    };
  }
}
</script>
</body>
</html>
