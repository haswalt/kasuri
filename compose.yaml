services:
  kasuri:
    build: .
    image: kasuri:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      HTTP_ALLOWED_HOSTS: ${HTTP_ALLOWED_HOSTS:-}
      HTTP_PRIVATE_HOSTS: ${HTTP_PRIVATE_HOSTS:-}
      MAX_ACTIVE_RUNS: ${MAX_ACTIVE_RUNS:-}
      RUN_HISTORY: ${RUN_HISTORY:-}
      RUN_HISTORY_DAYS: ${RUN_HISTORY_DAYS:-}
      FAILED_RUN_HISTORY_DAYS: ${FAILED_RUN_HISTORY_DAYS:-}
      HTTP_SECRETS: ${HTTP_SECRETS:-}
      BASIC_AUTH_FILE: /run/secrets/basic_auth
    volumes:
      - kasuri-data:/data
    secrets:
      - basic_auth
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
volumes:
  kasuri-data:
secrets:
  basic_auth:
    file: ./secrets/basic_auth
