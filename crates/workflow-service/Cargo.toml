[package]
name = "workflow-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
workflow-schema.workspace = true
connector-sdk.workspace = true
connectors-core.workspace = true
workflow-engine = { path = "../workflow-engine" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
croner = "4"
connectors-clairic = { path = "../connectors-clairic" }
connectors-http = { path = "../connectors-http" }
connectors-webhook = { path = "../connectors-webhook" }

sha2 = "0.11"

connectors-data = { path = "../connectors-data" }
workflow-data = { path = "../workflow-data" }

jsonschema = { version = "=0.62.0", default-features = false }

[dev-dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
