name: Feature request
description: Suggest a connector, capability or improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work. Example workflows or API shapes are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds with existing connectors, or other approaches.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Editor / UI
        - Workflow engine and runs
        - New connector
        - Existing connector
        - Webhooks
        - Data Tables / Context Store
        - MCP / agents
        - HTTP management API
        - Deployment / self-hosting
        - Other
