name: Build and test
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same pull request or branch supersedes the running checks.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # rust-toolchain.toml pins the compiler with the minimal profile, which has no
      # formatter or linter; this installs the pinned toolchain plus both components.
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # Gate on lints that indicate bugs. Style, complexity and perf lints are
      # reported locally and can be promoted here once the existing warnings are fixed.
      - run: cargo clippy --workspace --all-targets --locked -- -D clippy::correctness -D clippy::suspicious
      - run: npm install --global pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install --global pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:selfhost
      - run: pnpm test
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: docker build -t kasuri:ci .
      - run: node scripts/test-container.mjs kasuri:ci
