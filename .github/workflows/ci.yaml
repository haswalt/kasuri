name: Build and test
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same pull request or branch supersedes the running checks.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # What a pull request changed, so jobs and steps run only where they're needed.
  # Pushes and manual runs check everything. A change to the workflows, or to a
  # path no rule below covers, also checks everything. Skipped jobs count as
  # passed for required checks.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      web: ${{ steps.paths.outputs.web }}
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          rust=false web=false runtime=false all=false
          if [ "$EVENT" != pull_request ]; then
            all=true
          else
            for path in $(git diff --name-only "$BASE...$HEAD"); do
              case "$path" in
                # Rust, including the examples it compiles in and tests against.
                crates/*|Cargo.toml|Cargo.lock|rust-toolchain.toml|examples/*) rust=true ;;
                # TypeScript: the web app and shared packages.
                apps/*|packages/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml) web=true ;;
                # The runtime harness and Worker configuration.
                scripts/*|wrangler.jsonc) runtime=true ;;
                # Documentation and repository metadata: nothing to build or test.
                docs/*|*.md|LICENSE|.gitignore|.dev.vars.example|.github/ISSUE_TEMPLATE/*|.github/dependabot.yml) ;;
                *) all=true ;;
              esac
            done
          fi
          if [ "$all" = true ]; then rust=true web=true runtime=true; fi
          code=false
          if [ "$rust" = true ] || [ "$web" = true ] || [ "$runtime" = true ]; then code=true; fi
          echo "rust=$rust web=$web code=$code" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "rust=$rust"; echo "web=$web"; echo "code=$code"; } >> "$GITHUB_OUTPUT"
  # Lint: Rust when Rust changed, TypeScript when the web app changed.
  checks:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # rust-toolchain.toml pins the compiler with the minimal profile, which has no
      # formatter or linter; this installs the pinned toolchain plus both components.
      - if: needs.changes.outputs.rust == 'true'
        run: rustup component add rustfmt clippy
      - if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
      - if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all -- --check
      # Gate on lints that indicate bugs. Style, complexity and perf lints are
      # reported locally and can be promoted here once the existing warnings are fixed.
      - if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D clippy::correctness -D clippy::suspicious
      - if: needs.changes.outputs.web == 'true'
        run: npm install --global pnpm@12.21.0
      - if: needs.changes.outputs.web == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.web == 'true'
        run: pnpm --filter web lint
  # Unit tests for what changed, then the runtime suite (default objects mode),
  # which exercises the assembled application and so runs for any code change.
  application:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install --global pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.web == 'true'
        run: pnpm test:web
      - if: needs.changes.outputs.rust == 'true'
        run: pnpm test:rust
      - run: pnpm build
      - run: pnpm test:runtime
  # Explicit execution modes, including the workspace fallback. The application
  # job above exercises the unset/default objects mode.
  run-objects:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        execution: [workspace, objects, queues]
    env:
      RUN_EXECUTION: ${{ matrix.execution }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install --global pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:runtime
      # Many runs at once, some with 50 KB of state: all finish, and cancels apply.
      - if: matrix.execution != 'workspace'
        run: node scripts/scale-check.mjs --runs 300 --no-latency
      - if: matrix.execution != 'workspace'
        run: node scripts/scale-check.mjs --runs 100 --size 51200 --no-latency
