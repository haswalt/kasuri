[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
workflow-schema = { path = "crates/workflow-schema" }
connector-sdk = { path = "crates/connector-sdk" }
connectors-core = { path = "crates/connectors-core" }
